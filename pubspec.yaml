name: flutter_dashboard
description: >-
  Build a responsive admin dashboard fast: collapsible drawer nav, adaptive
  app bar with search, theming, and an optional built-in login flow.
  Backed by GetX routing and state.
version: 2.2.0
homepage: https://github.com/vaibhavhariramani/flutter_dashboard
repository: https://github.com/vaibhavhariramani/flutter_dashboard
issue_tracker: https://github.com/vaibhavhariramani/flutter_dashboard/issues

environment:
  sdk: '>=3.0.6 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter_staggered_grid_view: ^0.6.1
  google_fonts: 
  progress_loading_button: ^2.0.2
  intl: 
  reactive_forms: ^16.0.1
  equatable: ^2.0.3
  get_storage: ^2.0.3
  get: ^4.6.6
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0


flutter:

 
